# ╭──────────────────────────────────────────────────────────────────╮
# │  ZimMux — agent-mux tmux theme                                   │
# │  herdr Ink edition · dark                                          │
# ╰──────────────────────────────────────────────────────────────────╯
#
# Palette: herdr.dev Ink (dark)
#   ground #17171A · panel #26262B · edge #3a3a41
#   ink    #eae8ee · dim   #cdccd2 · faint #8a8891
#   accent lavender #cba6f7 · green #5fae74 · yellow #d3a027
#   red    #c73e3e · teal  #94e2d5 · muted  #55534a
#
# This file is self-locating: it works as a symlink from ~/.config/tmux/tmux.conf
# and resolves its own real path for the reload binding. Requires tmux 3.4+.

# ── Terminal / truecolor / feel ──────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -s extended-keys on
set -s escape-time 0
set -g history-limit 50000
set -g display-time 1500
set -g display-panes-time 1500
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#S — #W"
set -g allow-rename off

set -g mouse on

# ── Clipboard (cross-platform) ───────────────────────────────────────
# WSL2: clip.exe is always present and needs no X server, so try it first.
# Mouse drag release copies to the system clipboard.
if-shell -b "command -v clip.exe >/dev/null 2>&1" {
    set -g @clip "clip.exe"
} {
    if-shell -b "command -v pbcopy >/dev/null 2>&1" {
        set -g @clip "pbcopy"
    } {
        if-shell -b "command -v xclip >/dev/null 2>&1" {
            set -g @clip "xclip -selection clipboard"
        } {
            if-shell -b "command -v xsel >/dev/null 2>&1" {
                set -g @clip "xsel --clipboard --input"
            } {
                set -g @clip "cat >/dev/null"
            }
        }
    }
}

# Drag-release copies to the resolved system clipboard.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clip}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@clip}"

# ── Mouse behaviour ──────────────────────────────────────────────────
# Scroll enters copy mode automatically and exits at the bottom.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Right-click only selects the pane — Windows Terminal pastes natively,
# so binding paste here would double-paste.
bind -n MouseDown3Pane select-pane -t=

# ── Pane navigation (no prefix, Alt+ijkl, no wrap) ───────────────────
bind -n M-j if -F '#{pane_at_left}'  '' 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}' '' 'select-pane -R'
bind -n M-i if -F '#{pane_at_top}'   '' 'select-pane -U'
bind -n M-k if -F '#{pane_at_bottom}' '' 'select-pane -D'

# ── Pane management (no prefix) ──────────────────────────────────────
bind -n M-n split-window -h \; select-layout tiled
bind -n M-w kill-pane
bind -n M-o next-layout
bind -n M-g select-pane -m
bind -n M-y run 'tmux swap-pane -s \{marked\} && tmux select-pane -M'

# ── Window navigation (Alt+u = next, Alt+h = previous) ───────────────
bind -n M-u if -F '#{window_end_flag}'   '' 'next-window'
bind -n M-h if -F '#{window_start_flag}' '' 'previous-window'
bind -n M-m new-window

# ── Scroll mode (Alt+Tab in, i/k scroll, q or Escape out) ────────────
bind -n M-Tab if -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'
bind -T copy-mode i send-keys -X -N 2 scroll-up
bind -T copy-mode k send-keys -X -N 2 scroll-down
bind -T copy-mode I send-keys -X halfpage-up
bind -T copy-mode K send-keys -X halfpage-down

# ── Reload theme: PREFIX+r (self-locating, follows the symlink) ──────
bind r source-file "#{?#{==:#{config_files},},~/.config/tmux/tmux.conf,#{config_files}}" \; display-message "herdr-ink reloaded"

# ── Panes: thin herdr-style borders ──────────────────────────────────
# Inactive: faint grey single line. Active: lavender, bold label.
# Set @name on a pane (e.g. `set -p @name backend`) to label it.
set -g pane-border-style "fg=#3a3a41"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#cba6f7]#[bold],#[fg=#8a8891]}#{?@name,#{@name} • ,}#{b:pane_current_path} #[fg=#55534a]#{pane_id}#{?window_zoomed_flag, • zoom,}#[default] "

# ── Status bar: herdr tab-bar ────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#17171A,fg=#cdccd2"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100
set -g window-status-separator ""

# Left: session pill (workspace) + PREFIX chip (amber while active)
set -g status-left "#[bg=#26262B]#[fg=#cba6f7]#[bold] ◉ #S #[bg=#17171A]#[fg=#cdccd2]#[nobold]#{?client_prefix,#[bg=#d3a027]#[fg=#17171A]#[bold] PREFIX #[bg=#17171A]#[nobold],} "

# Tabs: inactive dim, active lavender pill
set -g window-status-style "bg=#17171A,fg=#8a8891"
set -g window-status-format "#[fg=#8a8891] #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-style "bg=#cba6f7,fg=#17171A,bold"
set -g window-status-current-format "#[bg=#cba6f7]#[fg=#17171A]#[bold] #I:#W#{?window_zoomed_flag, •Z,} #[bg=#17171A]#[nobold]"
set -g window-status-activity-style "fg=#5fae74"
set -g window-status-bell-style "fg=#d3a027,bold"
set -g window-status-last-style "fg=#cdccd2"

# Right: zoom chip + pane count + clock + host (herdr context line)
set -g status-right "#{?window_zoomed_flag,#[bg=#94e2d5]#[fg=#17171A]#[bold] zoom #[bg=#17171A]#[fg=#cdccd2]#[nobold],}#[bg=#26262B]#[fg=#cdccd2] #{window_panes} panes #[fg=#55534a]• #[fg=#cdccd2]%H:%M #[fg=#8a8891]%d %b #[fg=#cba6f7]#h #[bg=#17171A] "

# ── Dialogs / menus / modes (all Ink) ────────────────────────────────
set -g message-style "bg=#26262B,fg=#eae8ee"
set -g message-command-style "bg=#26262B,fg=#cba6f7"
set -g mode-style "bg=#cba6f7,fg=#17171A,bold"
set -g copy-mode-match-style "bg=#d3a027,fg=#17171A"
set -g copy-mode-current-match-style "bg=#5fae74,fg=#17171A"
set -g copy-mode-mark-style "bg=#cba6f7,fg=#17171A"
set -g menu-style "bg=#26262B,fg=#eae8ee"
set -g menu-selected-style "bg=#cba6f7,fg=#17171A,bold"
set -g menu-border-style "fg=#cba6f7"
set -g menu-border-lines rounded
set -g popup-style "bg=#17171A,fg=#eae8ee"
set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded
set -g clock-mode-colour "#cba6f7"
set -g display-panes-active-colour "#cba6f7"
set -g display-panes-colour "#55534a"
